site_name: KeepUp Smart e bilance Unica
site_url: https://github.com/ivanrobuschi-custom/Keep_up_bilance_Unica.git
site_author: Custom S.p.A.

theme:
  name: material
  logo: assets/icons/logo.png
  favicon: assets/icons/favicon.png
  language: it
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.sections
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - navigation.footer
  palette:
    primary: blue grey

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
  - tags

copyright: Copyright Custom S.p.A 2026

nav:
  - Home: index.md
  - La soluzione:
      - Panoramica: panoramica.md
      - Conformità fiscale e QR Code Free Form: conformita-fiscale.md
      - Funzionalità avanzate al banco: funzionalita-banco.md
      - Integrazione con Inventa Backoffice: inventa-backoffice.md
      - Scenari di applicazione: scenari.md
      - Benefici e vantaggi: benefici.md
  - Anagrafica da cassa a bilance:
      - Introduzione e sincronizzazione: anagrafica-introduzione.md
      - Configurazione KeepUp Smart: anagrafica-configurazione-kus.md
      - Configurazione di rete bilancia Unica: anagrafica-configurazione-unica.md
      - Trasmissione dati alle bilance: anagrafica-trasmissione.md
  - Pesate in cassa con QR Code:
      - Introduzione: qrcode-introduzione.md
      - Configurazione KeepUp Smart: qrcode-configurazione-kus.md
      - Configurazione bilancia Unica: qrcode-configurazione-unica.md
      - Configurazione bilancia Icona: qrcode-configurazione-icona.md
  - Materiali e risorse: materiali.md
